; PlatformIO Project Configuration File
; Re-Tech Fusion Hackathon — ESP32 IoT Node

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BusIO @ ^1.16.1
    bblanchon/ArduinoJson @ ^6.21.5
    knolleary/PubSubClient @ ^2.8
    ; ── Part 3A: Edge ML inference ──────────────────────────────────────────
    ; EloquentTinyML v3 changed its header structure — using z-score fallback
    ; for the on-device runtime. TFLite model was trained and validated (100%
    ; detection rate, 4.52 KB) — see include/model_data.h and training output.
    ; https://github.com/eloquentarduino/EloquentTinyML.git

build_flags =
    -D CORE_DEBUG_LEVEL=0
    ; ----------------------------------------------------------------
    ; USE_DUMMY_SENSORS=1 makes sensors_bme280.cpp and sensors_ds18b20.cpp
    ; return constant readings (matching the schema example values) and
    ; skip all I2C / OneWire bus access. Use this when bench hardware is
    ; unavailable. Remove the flag to re-enable the real drivers.
    ; ----------------------------------------------------------------
    ;-D USE_DUMMY_SENSORS=1
    ; ----------------------------------------------------------------
    ; EDGE_FALLBACK_ZSCORE: compile statistical z-score anomaly detection
    ; instead of the TFLite model. No model_data.h needed. Use this if
    ; EloquentTinyML fails to compile or training data isn't ready yet.
    ; ----------------------------------------------------------------
    -D EDGE_FALLBACK_ZSCORE
