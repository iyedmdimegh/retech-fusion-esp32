# =============================================================================
# Re-Tech Fusion — Mosquitto broker config for the dev laptop
#
# Usage (PowerShell, this directory or absolute path):
#   & 'C:\Program Files\mosquitto\mosquitto.exe' -c .\tools\mosquitto.conf -v
#
# Mosquitto v2 ships locked-down by default (localhost only + auth required).
# This config opens TCP 1883 on every interface and allows anonymous clients,
# which is appropriate for a hackathon LAN/hotspot. DO NOT use on a public IP.
# =============================================================================

listener 1883 0.0.0.0
allow_anonymous true

# Quieter logs in production; -v on the CLI overrides for verbose debugging.
log_type error
log_type warning
log_type notice
